name: Build Windows release

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slippery-taskbar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Compile C# app
        shell: cmd
        run: src\build-framework.cmd

      - name: Build setup and checksums
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must be X.Y.Z" }

          Push-Location bootstrap
          go vet ./...
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o SlipperyTaskbar-Setup.raw.exe .
          python .\add_setup_icon.py .\SlipperyTaskbar-Setup.raw.exe .\payload\slippery-taskbar.ico "..\SlipperyTaskbar-Setup-v$version.exe"
          Pop-Location

          Copy-Item .\src\SlipperyTaskbar.exe .\SlipperyTaskbar.exe
          $files = @('SlipperyTaskbar.exe', "SlipperyTaskbar-Setup-v$version.exe")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slippery-Taskbar-x64
          path: |
            SlipperyTaskbar.exe
            SlipperyTaskbar-Setup-v*.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it unchanged."
            exit 0
          }

          gh release create $tag `
            SlipperyTaskbar.exe `
            "SlipperyTaskbar-Setup-v$version.exe" `
            SHA256SUMS.txt `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Slippery Taskbar $tag" `
            --notes "First stable C#/.NET release. Includes the setup executable, a direct executable, and full source in the repository."
