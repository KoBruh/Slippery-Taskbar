name: Build and release Windows executable

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slippery-taskbar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Vet
        run: go vet ./...

      - name: Build Windows x64 executable
        shell: pwsh
        run: ./build.ps1

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slippery-Taskbar-x64
          path: |
            SlipperyTaskbar.exe
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release for VERSION
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must be in X.Y.Z format, got '$version'"
          }

          $tag = "v$version"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving the published release unchanged."
            exit 0
          }

          gh release create $tag `
            SlipperyTaskbar.exe `
            SHA256SUMS.txt `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Slippery Taskbar $tag" `
            --generate-notes
