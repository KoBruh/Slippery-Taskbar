name: Build Windows executable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Vet
        run: go vet ./...

      - name: Build icon-embedded Windows x64 executable
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Slippery-Taskbar-x64
          path: |
            SlipperyTaskbar.exe
            SHA256SUMS.txt
          if-no-files-found: error
